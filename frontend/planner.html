<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Planner – EcoNav</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/planner.css" />
  </head>
  <body>
    <!-- Floating EcoNav Sidebar (Sized tightly to fit content) -->
    <aside class="planner-sidebar shadow-lg">
      <div class="sidebar-header">
        <a href="index.html" class="back-nav">
          <i class="bi bi-arrow-left me-1"></i> Back to EcoNav
        </a>
        <h1 class="sidebar-title">Route Information</h1>
      </div>

      <div class="sidebar-content">
        <form id="route_planner_form">
          <!-- From Destination Input -->
          <div class="mb-3 position-relative">
            <label for="from_input" class="form-label-custom"
              >From (Starting point)</label
            >
            <div class="input-group-custom">
              <span class="input-icon"
                ><i class="bi bi-geo-alt-fill text-danger"></i
              ></span>
              <input
                type="text"
                id="from_input"
                class="form-control-custom"
                placeholder="Search starting point..."
                autocomplete="off"
              />
            </div>
            <div id="from_results" class="autocomplete-results d-none"></div>
          </div>

          <!-- To Destination Input -->
          <div class="mb-3 position-relative">
            <label for="to_input" class="form-label-custom"
              >To (Destination)</label
            >
            <div class="input-group-custom">
              <span class="input-icon"
                ><i class="bi bi-pin-map-fill text-primary"></i
              ></span>
              <input
                type="text"
                id="to_input"
                class="form-control-custom"
                placeholder="Search destination..."
                autocomplete="off"
              />
            </div>
            <div id="to_results" class="autocomplete-results d-none"></div>
          </div>

          <!-- Vehicle Type Dropdown -->
          <div class="mb-3">
            <label for="vehicle_type" class="form-label-custom"
              >Vehicle Type</label
            >
            <div class="input-group-custom">
              <span class="input-icon"
                ><i class="bi bi-car-front-fill text-success"></i
              ></span>
              <select id="vehicle_type" class="form-select-custom">
                <option value="sedan" selected>Sedan</option>
                <option value="suv">SUV</option>
              </select>
            </div>
          </div>

          <!-- Summary Section (One metric per row) -->
          <div class="summary-section mb-3">
            <div class="summary-header">
              <span>Summary</span>
              <i
                class="bi bi-info-circle text-muted"
                title="Estimated figures based on route distance and vehicle category"
              ></i>
            </div>

            <div class="summary-metrics-list">
              <div class="metric-row">
                <span class="metric-label">Emissions (CO₂e)</span>
                <strong class="metric-value emissions-val">(33.4 kg)</strong>
              </div>
              <div class="metric-row">
                <span class="metric-label">Distance</span>
                <strong class="metric-value distance-val">(6.0 km)</strong>
              </div>
              <div class="metric-row">
                <span class="metric-label">ETA</span>
                <strong class="metric-value eta-val">(18 mins)</strong>
              </div>
            </div>
          </div>

          <!-- Start Route Button -->
          <button
            type="submit"
            id="start_route_btn"
            class="btn btn-eco w-100 btn-start-route"
          >
            <i class="bi bi-navigation-fill me-2"></i>Start Route
          </button>
        </form>
      </div>
    </aside>

    <!-- Google Map Container -->
    <div id="google_map"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@mapbox/polyline@1.2.0/src/polyline.js"></script>
    <!-- SweetAlert2 for error messages -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/planner.js"></script>
  </body>
</html>
